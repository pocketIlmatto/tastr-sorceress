name: image

# Builds the image for linux/amd64 and linux/arm64 and pushes it to GHCR:
# - on every push to main,
# - weekly, to pick up base image and dependency fixes,
# - daily, but only when PyPI has a yt-dlp the last image doesn't have
#   (YouTube changes often and old yt-dlp versions stop working).
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # weekly rebuild
    - cron: "41 6 * * *" # daily yt-dlp check
  workflow_dispatch:

permissions: {}

concurrency:
  group: image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/pocketilmatto/tastr-sorceress

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      yt_dlp: ${{ steps.check.outputs.yt_dlp }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Log in to GHCR (read only)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find the newest yt-dlp and whether to build
        id: check
        env:
          DAILY_ONLY: ${{ github.event_name == 'schedule' && github.event.schedule == '41 6 * * *' }}
        run: |
          set -euo pipefail
          version="$(curl -fsSL --retry 3 https://pypi.org/pypi/yt-dlp/json | jq -r '.info.version')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Unexpected yt-dlp version from PyPI" >&2
            exit 1
          fi
          echo "yt_dlp=$version" >> "$GITHUB_OUTPUT"
          build=true
          if [ "$DAILY_ONLY" = "true" ]; then
            # Every image is also tagged yt-dlp-<version>; if that tag exists, nothing is new.
            if docker buildx imagetools inspect "$IMAGE:yt-dlp-$version" > /dev/null 2>&1; then
              build=false
              echo "The image already has yt-dlp $version; nothing to do."
            else
              echo "yt-dlp $version is new; building."
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            YT_DLP_VERSION=${{ needs.check.outputs.yt_dlp }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:yt-dlp-${{ needs.check.outputs.yt_dlp }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.github.yt-dlp.version=${{ needs.check.outputs.yt_dlp }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
